<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brew Bench">
<meta name="theme-color" content="#12181a">
<title>Brew Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one column, phone first. Sticky top bar, fixed bottom tabs, bottom sheets for every action. Wider screens get a centred 760px column. */
:root{
  --bg:#f3f4f1;--surface:#ffffff;--sunk:#e9ece8;--ink:#1b2422;--muted:#62706c;--line:#d5dbd7;
  --accent:#0f6b5c;--accent-ink:#ffffff;--warn:#a65f08;--ok:#2a7a4b;--over:#544fc0;--danger:#b3372f;
  --display:"Space Grotesk","Avenir Next","Segoe UI",sans-serif;--body:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181a;--surface:#1b2326;--sunk:#161d20;--ink:#e7ecea;--muted:#93a19d;--line:#2c373a;
  --accent:#4cc2ab;--accent-ink:#06211c;--warn:#e0a044;--ok:#62c08a;--over:#9d98f0;--danger:#ef7d74;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top,0) 0 calc(64px + env(safe-area-inset-bottom,0))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:38px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:none;border-color:transparent;color:var(--accent);padding:8px}
button.danger{color:var(--danger)}
button.sm{min-height:32px;padding:4px 10px;font-size:13px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px}
textarea{min-height:140px;font-size:14px}
label.item{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);margin:0}
.item input[type=checkbox]{width:20px;height:20px;flex:none}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:52px}
.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding-block:14px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1;min-width:0}.wrapf{flex-wrap:wrap}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav.tabs a{flex:1;text-align:center;padding:10px 4px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500}
nav.tabs a b{display:block;font:700 15px var(--display)}
nav.tabs a.on{color:var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:46px;width:100%;text-align:left;background:none;border-radius:0;border-width:1px 0 0}
.item:first-child{border-top:0}
.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
/* deck header */
.cmd{display:flex;gap:10px;align-items:stretch}
.cmd .art{flex:1;min-width:0;aspect-ratio:5/3;max-height:150px;border-radius:10px;background:var(--sunk) center/cover;border:1px solid var(--line);
  display:flex;align-items:flex-end;padding:8px;color:#fff;font:700 14px var(--display);text-shadow:0 1px 3px #000,0 0 8px #000}
.cmd .art.none{color:var(--muted);text-shadow:none;align-items:center;justify-content:center;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 17px var(--display)}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.curve{display:flex;align-items:flex-end;gap:4px;height:64px}
.curve div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;font-size:11px;color:var(--muted);height:100%}
.curve i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
/* sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sec>header{display:flex;align-items:center;gap:8px;padding:10px 12px}
.sec>header .ttl{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;min-height:0;font:700 15px var(--display)}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
.pill.under{color:var(--warn)}.pill.ok{color:var(--ok)}.pill.over{color:var(--over)}.pill.plain{color:var(--muted)}
.bar{height:3px;background:var(--sunk)}.bar i{display:block;height:100%;background:var(--accent)}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px -6px}
.crow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);width:100%;background:none;border-width:1px 0 0;border-radius:0;text-align:left;min-height:42px}
.crow .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex:none}.dot.own{background:var(--ok);border-color:var(--ok)}
.pips{display:inline-flex;gap:2px;flex:none}
.pip{width:17px;height:17px;border-radius:50%;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:#1b2422;background:#cfd4d2}
.pip.W{background:#f3ecc9}.pip.U{background:#a9d3ef}.pip.B{background:#b3a5ad}.pip.R{background:#f0a48c}.pip.G{background:#9fd3ad}
.pips.sm .pip{width:14px;height:14px;font-size:9px}
.btn{display:block;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;color:inherit;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;padding:8px;border-top:1px solid var(--line)}
.grid button{padding:0;border:0;background:var(--sunk);border-radius:6px;overflow:hidden;aspect-ratio:488/680;min-height:0;position:relative;font-size:11px}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .q{position:absolute;right:4px;bottom:4px;background:var(--surface);border-radius:6px;padding:0 5px;font-weight:700}
/* sheets */
.scrim{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0)}
.sheet>header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sheet>header h2{flex:1;min-width:0}
.sheet .body{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.sheet .body>*{flex-shrink:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:99px;min-height:32px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.res{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res .info{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;min-height:0}
.res .info div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .add{min-width:44px;font-weight:700}.res .add.in{background:var(--sunk);color:var(--ok)}
.peek{position:fixed;inset:0;z-index:30;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.peek img{max-height:62vh;border-radius:14px}
.peek p{color:#fff;max-width:420px;white-space:pre-wrap;font-size:14px;margin:0;max-height:22vh;overflow:auto}
.cardimg{align-self:center;width:min(260px,70%);border-radius:12px}
.otext{white-space:pre-wrap;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.secrow{display:grid;grid-template-columns:1fr 64px 38px;gap:6px}
.secrow input.q{grid-column:1/-1;font-size:13px}
.secbox{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}

/* life counter: one deliberate dark look so it reads at arm's length on a table */
#live{position:fixed;inset:0;z-index:15;background:#0c1113;color:#fff;display:flex;flex-direction:column;gap:4px;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.lbar{display:flex;align-items:center;gap:6px;padding:6px 10px 0}
#live button{color:#fff}
.lbar button,.lend{background:#1d262a;border-color:#33404a}
.lend{margin:0 4px}
.lgrid{flex:1;display:grid;gap:4px;padding:0 4px 4px;grid-auto-rows:1fr;min-height:0}
.pan{position:relative;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.pan.rot{transform:rotate(180deg)}
.pan.out{filter:grayscale(1) brightness(.5)}
.pan .zone{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;border-radius:0;font-size:30px;display:flex;align-items:center;padding:0 14px;min-height:0}
.pan .zone:active{background:#ffffff22}
.zone.minus{left:0;justify-content:flex-start}.zone.plus{right:0;justify-content:flex-end}
.pan .life{font:700 clamp(46px,15vw,104px)/1 var(--display);pointer-events:none;font-variant-numeric:tabular-nums}
.pan .who{pointer-events:none;font-weight:600;max-width:64%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pan .delta{pointer-events:none;height:18px;font-weight:700}
.pan .more{position:relative;z-index:1;margin-top:4px;background:#00000055;border-color:#ffffff66;font-size:12px;min-height:30px;padding:2px 10px}
nav.tabs a b{font-size:13px}
/* deck tester: one dark table look, everything done with taps */
#test{position:fixed;inset:0;z-index:15;background:#0c1113;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#test button{color:#fff;background:#1d262a;border-color:#33404a}
#test button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tbar{display:flex;align-items:center;gap:6px;padding:6px 8px;flex-wrap:wrap}
.tzone{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:0 6px;min-height:0}
.trow{background:#141b1e;border-radius:10px;padding:6px}
.trow h3{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#9fb0ab;margin:0 0 4px}
.tcards{display:flex;gap:6px;overflow-x:auto;min-height:93px;align-items:center;touch-action:pan-x pan-y}
.tc{flex:none;width:64px;height:89px;min-height:0;border-radius:5px;position:relative;font-size:10px;display:flex;align-items:flex-end;padding:3px;overflow:hidden;border:0;text-align:left}
.tc.tap{transform:rotate(90deg) scale(.72);opacity:.8}
.tc .badge{position:absolute;top:2px;right:2px;background:#000000cc;border-radius:6px;padding:0 5px;font-weight:700;font-size:11px}
.tc .nm{background:#000000aa;border-radius:3px;padding:1px 3px;line-height:1.2}
.thand{border-top:1px solid #2c373a;padding:6px 6px 4px}
.thand .tcards{min-height:130px}
.thand .tc{width:92px;height:128px}
.tdim{color:#7d8e89}
@media (prefers-reduced-motion:no-preference){.tc{transition:transform .12s}}


/* printable playtest proxies: hidden on screen, the only thing printed */
#print{display:none}
@media print{
  @page{size:letter;margin:6mm 8mm}
  body{background:#fff!important;color:#000!important;padding:0!important}
  body>*:not(#print){display:none!important}
  #print{display:block}
  .ppage{display:grid;grid-template-columns:repeat(3,63mm);grid-auto-rows:88mm;justify-content:center;break-after:page}
  .ppage:last-child{break-after:auto}
  .px{border:.3mm dashed #888;padding:3mm;display:flex;flex-direction:column;gap:1.2mm;overflow:hidden;font:7.4pt/1.25 Inter,Arial,sans-serif;color:#000}
  .px .hd{display:flex;justify-content:space-between;gap:2mm;font-weight:700;font-size:8.6pt;border-bottom:.3mm solid #000;padding-bottom:1mm}
  .px .ty{font-style:italic;border-bottom:.2mm solid #999;padding-bottom:1mm}
  .px .tx{white-space:pre-wrap;flex:1;overflow:hidden}
  .px .ft{display:flex;justify-content:space-between;font-weight:700;font-size:8pt}
  .px .bk{border-top:.4mm double #000;padding-top:1mm}
  .px.sm{font-size:6.3pt}.px.xs{font-size:5.4pt}
  .pm{display:inline-block;min-width:3.3mm;height:3.3mm;line-height:3.3mm;border:.25mm solid #000;border-radius:50%;text-align:center;font-size:6pt;margin-left:.3mm}

  /* card-style proxy: an original frame, tinted by the card's colors */
  .cx{--f:#b9b3a6;--l:#f1eee7;border:.3mm dashed #888;padding:1.6mm;display:flex;color:#000;font:6.6pt/1.22 Inter,Arial,sans-serif}
  .cx .fr{flex:1;border-radius:3mm;background:var(--f);padding:1.4mm;display:flex;flex-direction:column;gap:1mm;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cx .cbar,.cx .ft{flex:none}
  .cx .cbar{background:var(--l);border-radius:1.6mm;padding:.8mm 1.6mm;display:flex;justify-content:space-between;align-items:center;gap:1mm;font-weight:700;font-size:7.6pt;border:.25mm solid #0006}
  .cx .art{height:27mm;flex:none;background:var(--l);opacity:.75;text-align:center;border:.25mm solid #0006;border-radius:.8mm;display:flex;align-items:center;justify-content:center;font:700 7pt Inter,Arial,sans-serif;letter-spacing:.3em;color:#0005}
  .cx .ty{font-weight:600;font-size:6.8pt}
  .cx .tb{flex:1;background:#fbfaf7;border-radius:.8mm;padding:1.2mm 1.4mm;white-space:pre-wrap;overflow:hidden;border:.25mm solid #0004}
  .cx .tb .bk{display:block;border-top:.3mm solid #0006;margin-top:1mm;padding-top:.8mm;font-weight:600}
  .cx .ft{display:flex;justify-content:space-between;align-items:center;font-size:5pt;color:#000a;min-height:4.4mm}
  .cx .pt{background:var(--l);border:.25mm solid #0006;border-radius:1.4mm;padding:.3mm 2mm;font-weight:700;font-size:8pt;color:#000}
  .cx.sm{font-size:5.7pt}.cx.xs{font-size:4.9pt}.cx.xxs{font-size:4.2pt}.cx.sm .art,.cx.xs .art{height:20mm}.cx.xxs .art{height:12mm}
  .cp{display:inline-flex;align-items:center;justify-content:center;width:3.4mm;height:3.4mm;border-radius:50%;font-size:5.6pt;font-weight:700;margin-left:.3mm;background:#cfcac0;border:.2mm solid #0007;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bw .cx{--f:#d9d9d9!important;--l:#fff!important}.bw .cp{background:#fff!important}.bw .cx .art{color:#0007}
  .cp.W{background:#f6f0cf}.cp.U{background:#9fc9ea}.cp.B{background:#a99ea3}.cp.R{background:#ef9c84}.cp.G{background:#93c9a2}
}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);
  padding:9px 14px;border-radius:8px;font-size:14px;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}.sheet.still{animation:none}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="live" hidden></div>
<div id="test" hidden></div>
<div id="sheet" hidden></div>
<div id="peek" hidden></div>
<div id="toast" hidden role="status"></div>
<div id="print" aria-hidden="true"></div>
<script>
'use strict';
/* ================= state ================= */
const KEY='brewbench.v1';
/* Bump VERSION and add an entry at the top of NEWS with every change. */
const VERSION='2.13';
const NEWS=[
 ['2.13','Nov 12, 2026',['Ask Claude requests now say they come from Brew Bench and that the answer will be pasted back into it.']],
 ['2.12','Nov 12, 2026',['Ask Claude: Menu → Ask Claude for recommendations writes a request with your commander, themes, sections and card list. Copy it into the Claude app, then paste the answer back to add the suggested cards to your Maybeboard or straight into the deck.']],
 ['2.11','Nov 12, 2026',['Add cards from the Types view: each type has Search and Fill. Fill offers EDHREC\'s list for that type, EDHREC\'s top and high-synergy cards of that type, the most played cards of that type in your colors, and your themes.','Cards added from Types are filed into your sections automatically. Anything that matches no section waits in Unsorted.']],
 ['2.10','Nov 12, 2026',['Adding a section in Edit sections now offers your deck\'s themes, EDHREC\'s tags for your commander and the full theme list, and fills in a matching search.','Sections named after a creature type, like Dragons, now find cards of that type.','Any section that is not Ramp, Interaction, Card Advantage or Lands can take suggestions from your themes in Fill.']],
 ['2.9','Nov 12, 2026',['Sections named Game Plan, Pay Off or Finisher work the same in every deck, including older ones: they take suggestions from the deck\'s themes and use loose targets.','Edit sections has quick buttons to add Game Plan, Pay Off and Finisher. Adding one to a deck with no themes opens the themes screen.']],
 ['2.8','Nov 11, 2026',['Proxies can print in black and white to save ink. The art box now reads PLAYTEST CARD.']],
 ['2.7','Nov 11, 2026',['Playtest proxies now print in a card-style layout: a frame colored by the card\'s colors, cost in colored circles, a blank art box, type bar, text box and power/toughness badge. The plain text style is still available.']],
 ['2.6','Nov 11, 2026',['Print playtest proxies: Menu → Print playtest proxies makes card-sized text proxies, nine to a letter page. You can skip basics and cards you already own.']],
 ['2.5','Nov 10, 2026',['Collection: choose the printing of a card you own, and mark it foil. The card\'s picture and your collection value use that printing.','Scanner CSV imports keep the set and collector number when the file has them.']],
 ['2.4','Nov 10, 2026',['Fixed: flip buttons were missing on two-sided cards added before version 2.3, because their back side was never fetched.','A spell with a land on the back can always be played as its land in the tester, even before its back picture has loaded.']],
 ['2.3','Nov 10, 2026',['Two-sided cards can be flipped. In the tester, play either side from your hand (a spell/land card can be played as its land) and flip a card on the battlefield.','Card screens have a Show other side button for two-sided cards.']],
 ['2.2','Nov 10, 2026',['Deck tester: tap Test deck on any deck to shuffle up and play it solo. Opening hand with Commander mulligans, a hand you swipe through, a battlefield you tap, commander tax, library tools, graveyard and exile.','Tokens: the tester loads the tokens your deck\'s cards make, plus Treasure, Food, Clue and custom tokens.']],
 ['2.1','Nov 10, 2026',['Card type view: switch a deck between Sections and Types to see it grouped as Creatures, Instants, Sorceries, Artifacts, Enchantments, Planeswalkers, Battles and Lands.']],
 ['2.0','Nov 10, 2026',['New decks no longer start from one archetype. Every deck gets the same sections: Ramp, Interaction, Card Advantage and Lands, plus Game Plan, Pay Off and Finisher with looser targets.','Themes: pick as many as fit the deck, from EDHREC\'s tags for your commander, the commander\'s own text, or your own. Themes supply the suggestions for Game Plan, Pay Off and Finisher.','Auto-sort files cards that match any of your themes into Game Plan.','Older decks keep their sections. Menu has Convert to standard sections if you want to switch one over.','Default sections for new decks can be edited in Setup.']],
 ['1.17','Nov 10, 2026',['Two-sided cards with a land on the back now count as lands when sorting, and are still checked against your other sections.','Cards are shared across sections automatically: when you add a card anywhere, the app checks your other sections and marks it shared in any it fits. You can turn this off in Setup.']],
 ['1.16','Nov 10, 2026',['Auto-sort: imported cards are filed into your sections by checking each section\'s Scryfall search. Lands go to Lands. Cards that fit more than one section are shared.','An Auto-sort button on Unsorted does the same for anything sitting there.']],
 ['1.15','Nov 10, 2026',['Quick add: in Search, adding a card by name clears the box so you can type the next one right away, with a running list of what you added.','Paste several cards into any section, from Search or Fill. Text copied from a web page works; lines that are not card names are ignored.','Fill has a link that opens your commander\'s page on EDHREC.']],

let lastCall=0;
async function sf(path,body){
  const wait=Math.max(0,lastCall+110-Date.now());lastCall=Date.now()+wait;if(wait)await new Promise(r=>setTimeout(r,wait));
  let r;try{r=await fetch('https://api.scryfall.com'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined)}
  catch(e){throw new Error('Could not reach Scryfall. Check your connection.')}
  if(r.status===404)return{data:[]};
  const j=await r.json();if(!r.ok)throw new Error(j.details||'Scryfall could not run that search.');return j;
}
function slim(c){
  const f=(c.card_faces&&c.card_faces[0])||{};const iu=c.image_uris||f.image_uris||{};const pr=c.prices||{};
  return CARDS[c.name]={n:c.name,mc:c.mana_cost||f.mana_cost||'',cmc:c.cmc||0,t:c.type_line||'',
    o:c.oracle_text||(c.card_faces||[]).map(x=>x.name+'\n'+(x.oracle_text||'')).join('\n\n'),
    ci:c.color_identity||[],img:iu.normal||'',p:+(pr.usd||pr.usd_foil||0),gc:!!c.game_changer,pm:c.produced_mana||[],img2:(c.card_faces&&c.card_faces[1]&&c.card_faces[1].image_uris&&c.card_faces[1].image_uris.normal)||'',
    fx:(c.card_faces&&c.card_faces.length>1?c.card_faces:[c]).map(x=>({n:x.name||c.name,mc:x.mana_cost||'',t:x.type_line||'',o:x.oracle_text||'',pt:x.power!=null?x.power+'/'+x.toughness:x.loyalty!=null?'Loyalty '+x.loyalty:x.defense!=null?'Defense '+x.defense:''}))};
}
async function search(q){const j=await sf('/cards/search?order=edhrec&q='+encodeURIComponent(q));return j.data.map(slim)}
function lowerIndex(){const m=new Map();for(const n in CARDS){m.set(n.toLowerCase(),CARDS[n]);const f=n.split(' // ')[0].toLowerCase();if(!m.has(f))m.set(f,CARDS[n])}return m}
/* look up many names; returns {cards:[card|null aligned to names], missing:[names]} */
async function byNames(names){
  let idx=lowerIndex();const need=[...new Set(names.filter(n=>!idx.has(n.toLowerCase())))];
  for(let i=0;i<need.length;i+=75){const j=await sf('/cards/collection',{identifiers:need.slice(i,i+75).map(name=>({name:name.split(' // ')[0]}))});(j.data||[]).forEach(slim)}
  idx=lowerIndex();const cards=names.map(n=>idx.get(n.toLowerCase())||null);
  return{cards,missing:names.filter((n,i)=>!cards[i])};
}
function csvRow(l){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===','){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())}
/* accepts plain lists ("2 Sol Ring") and CSV exports from scanner apps (needs a Name column; Quantity is optional) */
function parseList(text){const lines=text.split(/\r?\n/);const head=csvRow(lines[0]||'').map(h=>h.toLowerCase());const ni=head.findIndex(h=>h==='name'||h==='card name'||h==='card');
  if(head.length>1&&ni>=0){const col=re=>head.findIndex(h=>re.test(h));const qi=col(/^(quantity|qty|count|amount)$/),si=col(/^(set code|set|edition code|edition)$/),ci=col(/^(collector number|collector's number|card number|number)$/),fi=col(/^(foil|finish|printing)$/);const m=new Map();
    lines.slice(1).forEach(l=>{if(!l.trim())return;const r=csvRow(l);const n=r[ni];if(!n)return;const e=m.get(n)||{n,q:0};e.q+=qi>=0?parseInt(r[qi])||1:1;
      if(!e.set&&si>=0&&ci>=0&&r[si]&&r[ci]){e.set=r[si].toLowerCase();e.cn=r[ci];e.foil=fi>=0&&/foil|etched|^(true|yes|1)$/i.test(r[fi])&&!/^(non-?foil|normal)$/i.test(r[fi])}m.set(n,e)});return[...m.values()]}
  const out=[];lines.forEach(l=>{l=l.trim();if(!l||/^(\/\/|#)/.test(l)||/^(deck|commander|sideboard|maybeboard|mainboard)\s*:?$/i.test(l))return;
  const m=l.match(/^(\d+)\s*x?\s+(.+)$/i);let q=1,n=l;if(m){q=+m[1];n=m[2]}
  n=n.replace(/\s+\([A-Za-z0-9]{2,6}\).*$/,'').replace(/\s+\*.*$/,'').trim();if(n)out.push({n,q})});return out}

const EDH={};

async function edhFetch(slug,kind='commanders'){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),7000);try{const r=await fetch('https://json.edhrec.com/pages/'+kind+'/'+slug+'.json',{signal:ac.signal});return r.ok?await r.json():null}catch(e){return null}finally{clearTimeout(t)}}
/* loads EDHREC's page data for the commander: theme tags and recommended card lists. {fail:true} when it cannot be reached */
async function edhLoad(d){const key=d.cmd.join('|');if(!d.cmd.length||EDH[key]!==undefined)return;EDH[key]=null;
  let j=await edhFetch(edhSlug(d.cmd));if(!j&&d.cmd.length>1)j=await edhFetch(edhSlug([...d.cmd].reverse()));
  const out={tags:[],lists:[],fail:!j};
  if(j){const tl=j.panels&&j.panels.taglinks;if(Array.isArray(tl))out.tags=tl.filter(t=>t&&t.value).slice(0,12).map(t=>({v:String(t.value),slug:String(t.slug||t.value).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}));
    const cl=j.container&&j.container.json_dict&&j.container.json_dict.cardlists;
    if(Array.isArray(cl))out.lists=cl.map(l=>({header:String(l.header||l.tag||'Cards'),cards:(l.cardviews||[]).filter(c=>c&&c.name).map(c=>({name:String(c.name),syn:typeof c.synergy==='number'?c.synergy:null,pct:c.potential_decks?(c.num_decks||c.inclusion||0)/c.potential_decks:null}))})).filter(l=>l.cards.length)}
  EDH[key]=out;const cur=deck();if(location.hash==='#deck'&&cur&&cur.cmd.join('|')===key){if(UI.themeOpen)themeSheet();else if(UI.tyOpen&&!$('#sheet').hidden&&!R)tyFillSheet(UI.tyOpen);else if($('#sheet').hidden)rerender()}}
/* searches to try for a section the user named, best guess first */
function autoQueries(name){const low=name.trim().toLowerCase();const slug=low.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(!slug)return[];const out=[];
  const lib=THEMES.find(t=>t[2]&&(t[0].toLowerCase()===low||(low.length>3&&(t[0].toLowerCase().includes(low)||low.includes(t[0].toLowerCase())))));
  if(lib)out.push({raw:lib[2],why:'the '+lib[0]+' theme search'});
  if(/^[a-z]+$/.test(low)){const one=low.replace(/(ves)$/,'f').replace(/(ies)$/,'y').replace(/(ches|shes|xes)$/,m=>m.slice(0,-2)).replace(/([^s])s$/,'$1');out.push({raw:'t:'+one,why:'cards with the type "'+one+'"'})}
  out.push({raw:'otag:gives-'+slug,why:'the Scryfall tag "gives-'+slug+'"'},{raw:'otag:'+slug,why:'the Scryfall tag "'+slug+'"'},{raw:'o:"'+low.replace(/"/g,'')+'"',why:'card text containing "'+low+'"'});return out}
function themeSuggest(d){const seen=new Set();const sugg=[];const push=(name,target,q,src)=>{const k=name.toLowerCase();if(seen.has(k))return;seen.add(k);sugg.push({name,target,q,src})};
  const cs=d.cmd.map(card);const text=cs.map(c=>c.o+' '+c.t).join(' ');const subs=[...new Set(cs.flatMap(c=>(c.t.split(' // ')[0].split('—')[1]||'').trim().split(/\s+/).filter(Boolean)))];const used=new Set();
  ((EDH[d.cmd.join('|')]||{}).tags||[]).forEach(({v:t,slug})=>{const lib=THEMES.find(x=>x[0].toLowerCase()===t.toLowerCase());const sub=subs.find(s=>t.toLowerCase().startsWith(s.toLowerCase().slice(0,Math.max(2,s.length-1))));if(sub)used.add(sub);
    /* an EDHREC tag becomes a section; its suggestions come from the Scryfall tag of the same name */
    push(t,lib?lib[1]:sub?15:10,lib?lib[2]:sub?'t:'+sub.toLowerCase():'otag:'+slug,'EDHREC')});
  subs.forEach(s=>{if(!used.has(s))push(s+' Kindred',15,'t:'+s.toLowerCase(),'card')});
  if(cs.length)THEMES.forEach(t=>{if(t[3]&&t[3].test(text))push(t[0],t[1],t[2],'card')});
  const rest=THEMES.filter(t=>!seen.has(t[0].toLowerCase())).map(t=>({name:t[0],target:t[1],q:t[2]}));return{sugg,rest}}

const frontOf=n=>n.split(' // ')[0];
const anyLand=n=>/Land/.test(card(n).t);              /* a land on either face, so spell/land two-sided cards count */
const pureLand=n=>/Land/.test(frontOf(card(n).t));    /* a land on the front: nothing else to check */
/* Scryfall does not list a card's tags, so for each section this asks Scryfall which of the given cards match that
   section's search. Returns [{s, names:Set}] in deck order. */
async function matchSections(d,cards,step){const landSec=d.sections.find(s=>/land/i.test(s.name));
  const pool=cards.filter(c=>!pureLand(c.n)&&c.n.indexOf('"')<0);const chunks=[];let cur=[],len=0;
  pool.forEach(c=>{const t=frontOf(c.n).length+7;if(len+t>720&&cur.length){chunks.push(cur);cur=[];len=0}cur.push(c);len+=t});if(cur.length)chunks.push(cur);
  const tq=t=>t.q||(autoQueries(t.name)[0]||{}).raw||'';
  const qs=d.sections.filter(s=>s!==landSec).map(s=>({s,list:(s.role==='plan'?[s.q,...d.themes.map(tq)]:[s.q||(s.flex?'':tq(s))]).filter(Boolean)})).filter(x=>x.list.length);const out=[];
  for(let i=0;i<qs.length&&chunks.length;i++){const{s,list}=qs[i];if(step)step(s,i,qs.length);const names=new Set();
    for(const q of list)for(const ch of chunks){let hits;try{hits=(await sf('/cards/search?q='+encodeURIComponent('('+q+') ('+ch.map(c=>'!"'+frontOf(c.n)+'"').join(' or ')+')'))).data.map(x=>x.name)}catch(e){break}
      const set=new Set(hits.flatMap(n=>[n,frontOf(n)]));ch.forEach(c=>{if(set.has(c.n)||set.has(frontOf(c.n)))names.add(c.n)})}
    out.push({s,names})}
  return out}
const shareInto=(c,sid)=>{if(c.s===sid||(c.x||[]).includes(sid))return 0;c.x=[...(c.x||[]),sid];return 1};
/* Files Unsorted cards: lands (either face) to Lands, everything else to the first section it matches, shared into the rest. */
async function autoSort(d){const todo=d.cards.filter(c=>c.s==='u');if(!todo.length){toast('Nothing in Unsorted to sort');return}
  const landSec=d.sections.find(s=>/land/i.test(s.name));const got={};const bump=s=>got[s.id]=(got[s.id]||0)+1;let shared=0;
  sheet('Sorting '+todo.length+' cards','<div id="sortP" class="empty">Starting…</div>');
  if(landSec)todo.forEach(c=>{if(anyLand(c.n)){c.s=landSec.id;bump(landSec)}});
  const res=await matchSections(d,todo,(s,i,n)=>{const e=$('#sortP');if(e)e.textContent='Checking '+s.name+' ('+(i+1)+' of '+n+')'});
  res.forEach(({s,names})=>todo.forEach(c=>{if(!names.has(c.n))return;if(c.s==='u'){c.s=s.id;bump(s)}else shared+=shareInto(c,s.id)}));
  save();rerender();const left=d.cards.filter(c=>c.s==='u').length;
  sheet('Sorted '+(todo.length-left)+' of '+todo.length,`<div class="list">${d.sections.filter(s=>got[s.id]).map(s=>`<div class="item"><span class="name">${esc(s.name)}</span><b class="num">${got[s.id]}</b></div>`).join('')||'<div class="item muted">Nothing matched any section.</div>'}</div>
    ${shared?`<p class="muted small" style="margin:0">${shared} time${shared===1?'':'s'} a card also fit another section and was marked shared there.</p>`:''}

function themeSheet(){const d=deck();const e=EDH[d.cmd.join('|')];const{sugg,rest}=themeSuggest(d);const all=[...sugg,...rest];UI.cats=all;
  const has=n=>d.themes.some(t=>t.name.toLowerCase()===n.toLowerCase());const chip=c=>`<button class="chip ${has(c.name)?'on':''}" data-act="thTog" data-i="${all.indexOf(c)}">${esc(c.name)}</button>`;
  const edh=sugg.filter(c=>c.src==='EDHREC'),own=sugg.filter(c=>c.src!=='EDHREC');const mine=d.themes.filter(t=>!all.some(c=>c.name.toLowerCase()===t.name.toLowerCase()));
  sheet('Themes for '+d.name,`<p class="muted small" style="margin:0">Pick every theme this deck is built around. Themes supply the suggestions for Game Plan, Pay Off and Finisher, and Auto-sort files matching cards into Game Plan.</p>
   ${d.cmd.length?`<label>EDHREC themes for ${esc(d.cmd.join(' + '))}</label>${edh.length?`<div class="chips">${edh.map(chip).join('')}</div>`:`<p class="muted small" style="margin:0">${e?'EDHREC has no themes available for this commander here.':'Loading from EDHREC…'}</p>`}`:'<p class="muted small" style="margin:0">Set a commander to get suggestions for it.</p>'}
   ${own.length?`<label>From the commander's card</label><div class="chips">${own.map(chip).join('')}</div>`:''}
   <label>All themes</label><div class="chips">${rest.map(chip).join('')}</div>
   <label for="thNew">Your own</label>${mine.length?`<div class="chips">${mine.map(t=>`<button class="chip on" data-act="thDel" data-n="${esc(t.name)}">${esc(t.name)} ✕</button>`).join('')}</div>`:''}
   <div class="row"><input id="thNew" class="grow" placeholder="e.g. Scry" autocomplete="off"><button data-act="thAdd">Add</button></div>`,`<button class="pri" data-act="close">Done</button>`);UI.themeOpen=true}
/* turns an older archetype-based deck into the standard sections; its old theme sections become themes */
function convertStd(d){const ns=S.template.map(x=>({...x,id:uid()}));const by=re=>ns.find(x=>re.test(x.name));const plan=ns.find(x=>x.role==='plan')||ns[ns.length-1];const map={};
  d.sections.forEach(o=>{const n=o.name;const t=/ramp/i.test(n)?by(/ramp/i):/draw|advantage/i.test(n)?by(/advantage|draw/i):/removal|wipe|interaction|counterspell|protection/i.test(n)?by(/interaction|removal/i):/land/i.test(n)?by(/land/i):/finisher/i.test(n)?by(/finisher/i):/pay ?off/i.test(n)?by(/pay ?off/i):null;
    map[o.id]=(t||plan).id;if(!t&&!/^(theme|new section)$/i.test(n)&&!d.themes.some(x=>x.name.toLowerCase()===n.toLowerCase()))d.themes.push({name:n,q:o.q||''})});
  d.cards.forEach(c=>{if(c.s!=='u'&&c.s!=='m')c.s=map[c.s]||'u';c.x=[...new Set((c.x||[]).map(i=>map[i]).filter(i=>i&&i!==c.s))]});d.sections=withLands(ns);d.arch=''}
function dmgSheet(pid){const L=S.live;const p=L.players.find(p=>p.pid===pid);const row=(label,val,dec,inc,extra)=>`<div class="row"><span class="grow">${label}</span><button class="sm" data-act="${dec}" data-pid="${pid}" ${extra} aria-label="One less">−</button><b class="num" style="min-width:26px;text-align:center">${val}</b><button class="sm" data-act="${inc}" data-pid="${pid}" ${extra} aria-label="One more">+</button></div>`;
  sheet(pname(pid),`<p class="muted small" style="margin:0">Commander damage also lowers life. 21 from one commander, 10 poison, or 0 life puts a player out.</p>
   ${L.players.filter(o=>o.pid!==pid).map(o=>row('From '+esc(pname(o.pid))+"'s commander",p.cd[o.pid]||0,'cdDec','cdInc',`data-from="${o.pid}"`)).join('')}
   ${row('Poison counters',p.poison,'poDec','poInc','')}`,`<button data-act="liveOut" data-pid="${pid}">${p.out?'Bring back into the game':'Mark as out (conceded)'}</button>`)}

  async pasteClip(){try{const t=await navigator.clipboard.readText();if(t){$('#pasteT').value=t;return}}catch(e){}toast('Tap inside the box and choose Paste')},
  async pasteGo(e){const d=deck();const sid=e.dataset.sid;const nm=sid==='u'?'Unsorted':sid==='m'?'Maybeboard':secOf(d,sid).name;
    let raw=$('#pasteT').value;const ai=raw.search(/cards to add/i);if(ai>=0){raw=raw.slice(ai).replace(/^[^\n]*\n?/,'');const ci=raw.search(/cards to cut/i);if(ci>=0)raw=raw.slice(0,ci)}
    const names=[...new Set(parseList(raw).map(i=>i.n.replace(/^[-*•\s]+/,'').replace(/[*_`]/g,'').trim()).filter(n=>n.length<=60&&/[a-z]/i.test(n)&&!/[%$]/.test(n)))].slice(0,300);
    if(!names.length){toast('Nothing to add');return}toast('Looking up '+names.length+' lines…');let r;try{r=await byNames(names)}catch(err){toast(err.message);return}
    const id=ident(d);const added=[],had=[],off=[];[...new Set(r.cards.filter(Boolean).map(c=>c.n))].forEach(n=>{const c=card(n);
      if(d.cmd.length&&!c.ci.every(k=>id.includes(k)))off.push(n);else if(inDeck(d,n)&&!isBasic(n))had.push(n);else{addCard(d,n,sid);added.push(n)}});
    save();rerender();if(e.dataset.sort&&added.length){autoSort(d);return}const line=(t,a)=>a.length?`<div><h3>${t} · ${a.length}</h3><p class="muted small" style="margin:4px 0 0">${esc(a.join(', '))}</p></div>`:'';
    sheet('Added '+added.length+' to '+nm,(line('Added',added)||'<p style="margin:0">No new cards were added.</p>')+line('Already in this deck',had)+line('Outside this deck\'s colors, skipped',off)+(r.missing.length?`<p class="muted small" style="margin:0">${r.missing.length} line${r.missing.length===1?' was':'s were'} not a card name and ignored.</p>`:''))},
  fillEdh(e){const d=deck();const ls=EDH[d.cmd.join('|')].lists;sheet('EDHREC picks',`<p class="muted small" style="margin:0">Pick a list. Cards go into ${esc(secOf(d,e.dataset.sid).name)}.</p><div class="list">${ls.map((l,i)=>`<button class="item" data-act="fillEdhList" data-sid="${e.dataset.sid}" data-i="${i}"><span class="name">${esc(l.header)}</span><span class="muted num">${l.cards.length}</span></button>`).join('')}</div>`)},

    R={ctx:{k:'deck',sid},cards:[],fill:true,ownedFirst:false,ownedOnly:false,loading:true,started:true,meta:{}};const mine=R;
    sheet(l.header+' → '+secOf(d,sid).name,'<div id="res"></div>');R=mine;drawRes();

function testStart(d){let k=0;const mkc=n=>({id:'c'+(k++),n,tapped:false,ctr:0});const lib=[];main(d).forEach(c=>{for(let i=0;i<c.q;i++)lib.push(mkc(c.n))});

const backOf=n=>{const k=card(n);const bt=k.t.split(' // ')[1]||'';return k.img2||(/Land/.test(bt)&&n.includes(' // '))?{n:n.split(' // ')[1]||n,t:k.t.split(' // ')[1]||k.t,img:k.img2,mc:'',o:k.o,flipped:true}:null};

  askOpen(){askSheet()},
  askGoal(e){askRead();UI.ask.goal=e.dataset.k;askSheet()},
  async askCopy(){askRead();const t=askPrompt(deck(),UI.ask);$('#askP').value=t;try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into Claude.')}catch(err){const a=$('#askP');a.focus();a.select();toast('Select the text and copy it')}}
});
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-act]');if(!e)return;const f=A[e.dataset.act];if(f)f(e,ev)});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='mv'){const c=deck().cards.find(c=>c.n===t.dataset.n);c.s=t.value;c.x=(c.x||[]).filter(i=>i!==c.s);save();cardSheet(c.n);toast('Moved')}
  if(t.id==='toPkg'&&t.value){const p=S.packages.find(p=>p.id===t.value);if(!p.cards.includes(t.dataset.n))p.cards.push(t.dataset.n);save();toast('Added to '+p.name)}
  if(t.id==='addCat'&&t.value){const d=deck();if(t.value==='custom'){d.sections.unshift(SEC('New section',5));save();A.editSecs()}else{const c=UI.cats[+t.value];d.sections.unshift(SEC(c.name,c.target,c.q));save();rerender();toast('Added '+c.name+'. Change its target in Edit sections.')}}
  if(t.dataset&&t.dataset.popt){UI.pOpt[t.dataset.popt]=t.checked;printOpts()}
  if(t.id==='edPick'&&t.value){readEd();const c=t.value==='blank'?{name:'New section',target:5,q:''}:UI.edCh[+t.value];ED.rows.push(applyRole(SEC(c.name,c.target,c.q||'')));drawEd();const b=$('#sheet .body');if(b)b.scrollTop=b.scrollHeight;if(t.value==='blank'){const ns=document.querySelectorAll('.secbox input.n');const l=ns[ns.length-1];if(l){l.focus();l.select()}}}
  if(t.id==='collLocSel'){UI.collLoc=t.value;rerender()}
  if(t.dataset.pull!==undefined){const d=deck();d.pulled=d.pulled||{};if(t.checked)d.pulled[t.dataset.pull]=1;else delete d.pulled[t.dataset.pull];save();$('#pullN').textContent=Object.keys(d.pulled).filter(n=>owned(n)).length}
  if(t.id==='pType'){$('#pS').hidden=t.value!=='scryfall';$('#pC').hidden=t.value!=='custom'}});
document.addEventListener('input',ev=>{if(ev.target.id==='tS'){const q=ev.target.value.trim().toLowerCase();document.querySelectorAll('#tSL .item').forEach(x=>x.hidden=!!q&&!x.dataset.f.includes(q))}
  if(ev.target.classList.contains('gn')){const i=[...document.querySelectorAll('.gsrow')].indexOf(ev.target.closest('.gsrow'));const dl=$('#dl'+i);if(dl&&i>0)dl.innerHTML=deckOpts(i,ev.target.value.trim())}
  if(ev.target.id==='collQ'){UI.collQ=ev.target.value;const q=UI.collQ.toLowerCase();const l=$('#collList');if(l)l.innerHTML=collRows(collShown())}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('#peek').hidden)A.unpeek();else if(!$('#sheet').hidden)A.close()}});
window.addEventListener('hashchange',route);
load();route();
</script>
</body>
</html>
