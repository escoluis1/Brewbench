    sheet(d.name,`<p class="muted small" style="margin:0">${esc(d.cmd.join(' + ')||'No commander yet')} · ${total(d)}/100 cards</p><div class="list">
     <button class="item" data-act="openDeck" data-id="${d.id}">Open</button>
     <button class="item" data-act="test">Test deck</button>
     <button class="item" data-act="rename">Rename</button>
     <button class="item" data-act="deckDup">Duplicate</button>
     <button class="item" data-act="deckShare">Share card list</button>
     <button class="item" data-act="deckFileOut">Share as a Bolt the Bird deck file</button>
     <button class="item" data-act="exportDeck">Show card list to copy</button>
     <button class="item" data-act="printOpen">Print playtest proxies</button>
     <button class="item" data-act="askOpen">Ask Claude for recommendations</button>
     ${top?'':'<button class="item" data-act="deckTop">Move to the top of the list</button>'}
     <button class="item danger" data-act="delDeckAsk">Delete</button></div>`)},
  deckDup(){const d=deck();const c=JSON.parse(JSON.stringify(d));c.id=uid();c.pulled={};const base=d.name.replace(/ copy( \d+)?$/,'');let n=base+' copy',i=2;while(S.decks.some(x=>x.name===n))n=base+' copy '+(i++);c.name=n;
    S.decks.splice(S.decks.indexOf(d)+1,0,c);save();closeSheet();rerender();toast('Made '+n)},
  deckTop(){const d=deck();S.decks=[d,...S.decks.filter(x=>x!==d)];save();closeSheet();rerender()},
  async deckShare(){const d=deck();const txt=d.name+'\n'+(d.cmd.length?'Commander: '+d.cmd.join(' + ')+'\n':'')+'\n'+deckText(d);
    try{if(navigator.share){await navigator.share({title:d.name,text:txt});closeSheet();return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(txt);closeSheet();toast('Card list copied')}catch(e){A.exportDeck()}},
  async deckFileOut(){const d=deck();const txt=deckFile(d);const name=d.name.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()+'.brewbench.json';
    try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:d.name});closeSheet();return}}catch(e){if(e&&e.name==='AbortError')return}
    download(name,txt);closeSheet();toast('Deck file downloaded')},
  deckImport(){sheet('Import a deck',`<label for="diName">Deck name</label><input id="diName" placeholder="Used when you paste a card list" autocomplete="off">
     <label for="diText">Paste a card list</label><textarea id="diText" placeholder="1 Sol Ring&#10;1 Arcane Signet"></textarea>
     <p class="muted small" style="margin:0">One card per line. Cards are filed into sections automatically. You pick the commander afterwards.</p>
     <label for="diFile">Or choose a Bolt the Bird deck file</label><input id="diFile" type="file" accept=".json,application/json">
     <p class="muted small" style="margin:0">A deck file from someone else's Bolt the Bird keeps its sections and themes.</p>`,`<button class="pri" data-act="deckImportGo">Import</button>`)},
  async deckImportGo(){const f=$('#diFile').files[0];let txt=$('#diText').value.trim();
    if(f){try{txt=await f.text()}catch(e){toast('Could not read that file');return}}
    if(!txt){toast('Paste a card list or choose a file');return}
    if(txt[0]==='{'){try{const j=JSON.parse(txt);if(j.brewbench!=='deck')throw 0;const d=addDeckFromFile(j);closeSheet();UI.deck=d.id;location.hash='deck';route();toast('Imported '+d.name);hydrate()}catch(e){toast(/"decks"/.test(txt)?'That is a full backup. Use Setup → Import backup for it.':'That is not a Bolt the Bird deck file')}return}
    const d={id:uid(),name:$('#diName').value.trim()||'Imported deck',cmd:[],arch:'',themes:[],sections:withLands(S.template.map(x=>({...x,id:uid()}))),cards:[]};
    S.decks.unshift(d);save();UI.deck=d.id;closeSheet();location.hash='deck';route();importList(txt,'deck')}
});
/* ================= color balance ================= */
const CNAME={W:'White',U:'Blue',B:'Black',R:'Red',G:'Green'};
/* colors a card can find by searching for lands: named land types (plus the colors of this deck's lands with those types), or the deck's basics */
const BTYPE={Plains:'W',Island:'U',Swamp:'B',Mountain:'R',Forest:'G'};
function fetchColors(d,n,id){const o=card(n).o||'';const m=o.match(/search(?:es)? (?:your|their) library for ([^.]*)/i);if(!m||!/\b(land|plains|island|swamp|mountain|forest)\b/i.test(m[1]))return[];
  const clause=m[1];const types=Object.keys(BTYPE).filter(t=>new RegExp('\\b'+t+'\\b','i').test(clause));const out=new Set();const deckLands=main(d).filter(c=>anyLand(c.n));
  if(types.length){types.forEach(t=>out.add(BTYPE[t]));deckLands.forEach(c=>{if(types.some(t=>card(c.n).t.includes(t)))(card(c.n).pm||[]).forEach(x=>out.add(x))})}
  else if(/basic land/i.test(clause)){const b=deckLands.filter(c=>/Basic/.test(card(c.n).t));if(b.length)b.forEach(c=>Object.entries(BTYPE).forEach(([t,x])=>{if(card(c.n).t.includes(t))out.add(x)}));else id.forEach(x=>out.add(x))}
  else if(/\bland card\b/i.test(clause))id.forEach(x=>out.add(x));
  return[...out].filter(x=>id.includes(x))}
/* need = colored symbols in costs (a two-color hybrid symbol counts half for each); have = cards that can make that color */
function manaStats(d){const id=['W','U','B','R','G'].filter(c=>ident(d).includes(c));const need={},lands={},other={},who={},cost={};id.forEach(c=>{need[c]=0;lands[c]=0;other[c]=0;who[c]=[];cost[c]=[]});let cOnly=0;
  [...d.cmd.map(n=>({n,q:1})),...main(d)].forEach(c=>{const per={};((card(c.n).mc||'').match(/\{[^}]+\}/g)||[]).forEach(x=>{const cs=[...new Set(x.match(/[WUBRG]/g)||[])];cs.forEach(k=>{if(k in need)per[k]=(per[k]||0)+1/cs.length})});
    for(const k in per){need[k]+=per[k]*c.q;cost[k].push({n:c.n,v:per[k]})}});
  let fetchN=0;main(d).forEach(c=>{const pm=card(c.n).pm||[];let cols=pm.filter(x=>x in need);let f=false;if(!cols.length){const fc=fetchColors(d,c.n,id);if(fc.length){cols=fc;f=true;fetchN+=c.q}}
    if(!cols.length){if(pm.length)cOnly+=c.q;return}const land=anyLand(c.n);cols.forEach(k=>{(land?lands:other)[k]+=c.q;who[k].push({n:c.n,q:c.q,land,f})})});
  const nT=id.reduce((a,c)=>a+need[c],0),sT=id.reduce((a,c)=>a+lands[c]+other[c],0);
  return{id,cOnly,fetchN,nT,sT,rows:id.map(c=>{const np=nT?need[c]/nT*100:0,sp=sT?(lands[c]+other[c])/sT*100:0;return{c,need:need[c],np,lands:lands[c],other:other[c],sp,gap:np-sp,who:who[c],cost:cost[c]}})}}
const manaVerdict=r=>!r.need?['','No costs']:r.lands+r.other===0?['▲','No sources']:r.gap>5?['▲','Short']:r.gap<-12?['','Plenty']:['✓','On track'];
function manaHtml(d){if(!d.cmd.length||!main(d).length)return'';const m=manaStats(d);if(!m.id.length)return'';
  if(!m.nT)return`<div class="sec"><header><span class="ttl">Color balance</span></header><p class="muted small" style="margin:0;padding:0 12px 10px">No colored mana costs in the deck yet.</p></div>`;
  return`<div class="sec"><header><span class="ttl">Color balance</span><span class="muted small">tap a color</span></header>
    <div class="cbl"><span><i style="background:var(--s1)"></i>Share of colored symbols in your costs</span><span><i style="background:var(--s2)"></i>Share of your color sources</span></div>
    ${m.rows.map(r=>{const[ic,tx]=manaVerdict(r);return`<button class="cb" data-act="manaColor" data-c="${r.c}" title="${CNAME[r.c]}: ${Math.round(r.np)}% of colored symbols, ${Math.round(r.sp)}% of color sources">
      <span class="pip ${r.c}">${r.c}</span>
      <span class="cbars"><span class="cbr"><i style="width:${r.np*.78}%;background:var(--s1)"></i><b>${Math.round(r.np)}%</b></span><span class="cbr"><i style="width:${r.sp*.78}%;background:var(--s2)"></i><b>${Math.round(r.sp)}%</b></span></span>
      <span class="cbv"><span style="color:${ic==='▲'?'var(--warn)':ic==='✓'?'var(--ok)':'var(--muted)'}">${ic}</span> ${tx}<small>${r.lands+r.other} source${r.lands+r.other===1?'':'s'}</small></span></button>`}).join('')}
    <p class="muted small" style="margin:0;padding:8px 12px 10px;border-top:1px solid var(--line)">${Math.round(m.nT)} colored symbols in costs. A card that makes two colors counts as a source of both.${m.fetchN?' '+m.fetchN+(m.fetchN===1?' fetch land or land-search card counts for the colors it can find.':' fetch lands and land-search cards count for the colors they can find.'):''}${m.cOnly?' '+m.cOnly+' card'+(m.cOnly===1?' makes':'s make')+' only colorless mana.':''}</p></div>`}
Object.assign(A,{
  manaColor(e){const d=deck();const m=manaStats(d);const r=m.rows.find(x=>x.c===e.dataset.c);if(!r)return;const[ic,tx]=manaVerdict(r);
    const names=l=>l.sort((a,b)=>a.n.localeCompare(b.n)).map(x=>`<button class="item" data-act="peek" data-n="${esc(x.n)}"><span class="name">${x.q>1?x.q+'× ':''}${esc(x.n)}${x.f?' <span class="muted small">finds</span>':''}</span>${costOrMana(card(x.n))}</button>`).join('');
    const lands=r.who.filter(x=>x.land),other=r.who.filter(x=>!x.land);const top=[...r.cost].sort((a,b)=>b.v-a.v||a.n.localeCompare(b.n)).slice(0,8);
    sheet(CNAME[r.c]+' mana',`<p style="margin:0"><b>${ic} ${tx}.</b> ${CNAME[r.c]} is ${Math.round(r.np)}% of the colored symbols in your costs and ${Math.round(r.sp)}% of your color sources.</p>
     <p class="muted small" style="margin:0">${r.gap>5?'Your costs lean on '+CNAME[r.c].toLowerCase()+' more than your mana does. Add '+CNAME[r.c].toLowerCase()+' sources or trim heavy '+CNAME[r.c].toLowerCase()+' costs.':r.gap<-12?'You have more '+CNAME[r.c].toLowerCase()+' sources than your costs call for. Some could become another color.':'Your sources match what your costs ask for.'} This compares shares, so it shows balance between colors, not whether you have enough mana overall.</p>
     <label>Lands that make ${CNAME[r.c].toLowerCase()} · ${r.lands}</label>${lands.length?`<div class="list">${names(lands)}</div>`:'<p class="muted small" style="margin:0">None yet.</p>'}
     <label>Other cards that make ${CNAME[r.c].toLowerCase()} · ${r.other}</label>${other.length?`<div class="list">${names(other)}</div>`:'<p class="muted small" style="margin:0">None yet.</p>'}
     <label>Cards that need ${CNAME[r.c].toLowerCase()} most</label>${top.length?`<div class="list">${top.map(x=>`<button class="item" data-act="peek" data-n="${esc(x.n)}"><span class="name">${esc(x.n)}</span>${pips(card(x.n).mc)}</button>`).join('')}</div>`:'<p class="muted small" style="margin:0">None.</p>'}`)}
});
/* ================= select several cards ================= */
function selBar(){const b=$('#selbar');if(!UI.sel){b.hidden=true;document.body.classList.remove('sel');return}b.hidden=false;document.body.classList.add('sel');const n=UI.sel.size;const d=deck();const un=d?d.cards.filter(c=>c.s==='u').length:0;
  b.innerHTML=`<div class="wrap"><b class="grow">${n} selected</b>${un?'<button class="sm" data-act="selUnsorted">All in Unsorted</button>':''}<button class="sm" data-act="selEnd">Done</button>
   <div class="row wrapf" style="width:100%"><button class="sm pri" data-act="selMove" ${n?'':'disabled'}>Move to…</button><button class="sm" data-act="selShare" ${n?'':'disabled'}>Also count toward…</button><button class="sm" data-act="selMaybe" ${n?'':'disabled'}>Maybeboard</button><button class="sm danger" data-act="selDelAsk" ${n?'':'disabled'}>Remove</button></div></div>`}
function selEnd(quiet){UI.sel=null;UI.selDeck=null;selBar();if(!quiet)rerender()}
const selCards=()=>{const d=deck();return d.cards.filter(c=>UI.sel.has(c.n))};
function selPick(title,act,incl){const d=deck();const opts=[...(incl?[{id:'u',name:'Unsorted'}]:[]),...d.sections];
  sheet(title,`<p class="muted small" style="margin:0">${UI.sel.size} card${UI.sel.size===1?'':'s'} selected.</p><div class="list">${opts.map(s=>`<button class="item" data-act="${act}" data-sid="${s.id}"><span class="name">${esc(s.name)}</span><span class="muted small num">${cnt(inSec(d,s.id))}${s.target&&!s.flex?' / '+s.target:''}</span></button>`).join('')}</div>`)}
Object.assign(A,{
  selStart(e){closeSheet();UI.sel=new Set();UI.selDeck=UI.deck;if(e&&e.dataset&&e.dataset.u)deck().cards.filter(c=>c.s==='u').forEach(c=>UI.sel.add(c.n));UI.group='sec';rerender();selBar()},
  selEnd(){selEnd()},
  selTog(e){const n=e.dataset.n;if(UI.sel.has(n))UI.sel.delete(n);else UI.sel.add(n);const on=UI.sel.has(n);
    document.querySelectorAll('[data-act="selTog"]').forEach(x=>{if(x.dataset.n!==n)return;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);const k=x.querySelector('.ck');if(k)k.classList.toggle('on',on)});selBar()},
  selUnsorted(){deck().cards.filter(c=>c.s==='u').forEach(c=>UI.sel.add(c.n));rerender();selBar()},
  selMove(){selPick('Move to','selMoveGo',true)},
  selMoveGo(e){const sid=e.dataset.sid;const cs=selCards();cs.forEach(c=>{c.s=sid;c.x=(c.x||[]).filter(i=>i!==sid)});save();closeSheet();const nm=sid==='u'?'Unsorted':secOf(deck(),sid).name;toast('Moved '+cs.length+' to '+nm);UI.sel=new Set();rerender();selBar()},
  selShare(){selPick('Also count toward','selShareGo',false)},
  selShareGo(e){const sid=e.dataset.sid;let k=0;selCards().forEach(c=>{if(c.s==='u'||c.s==='m'){c.s=sid;k++}else k+=shareInto(c,sid)});save();closeSheet();toast(k+' card'+(k===1?' now counts':'s now count')+' toward '+secOf(deck(),sid).name);UI.sel=new Set();rerender();selBar()},
  selMaybe(){const cs=selCards();cs.forEach(c=>{c.s='m';c.x=[]});save();toast('Moved '+cs.length+' to the Maybeboard');UI.sel=new Set();rerender();selBar()},
  selDelAsk(){confirmSheet('Remove cards','Remove '+UI.sel.size+' card'+(UI.sel.size===1?'':'s')+' from this deck? Your collection is not affected.','selDel','Remove')},
  selDel(){const d=deck();const n=UI.sel.size;d.cards=d.cards.filter(c=>!UI.sel.has(c.n));save();closeSheet();toast('Removed '+n);UI.sel=new Set();rerender();selBar()},
  recheck(){recheck(deck())}
});
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-act]');if(!e)return;const f=A[e.dataset.act];if(f)f(e,ev)});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='mv'){const c=deck().cards.find(c=>c.n===t.dataset.n);c.s=t.value;c.x=(c.x||[]).filter(i=>i!==c.s);save();cardSheet(c.n);toast('Moved')}
  if(t.id==='toPkg'&&t.value){const p=S.packages.find(p=>p.id===t.value);if(!p.cards.includes(t.dataset.n))p.cards.push(t.dataset.n);save();toast('Added to '+p.name)}
  if(t.id==='addCat'&&t.value){const d=deck();if(t.value==='custom'){d.sections.unshift(SEC('New section',5));save();A.editSecs()}else{const c=UI.cats[+t.value];d.sections.unshift(SEC(c.name,c.target,c.q));save();rerender();toast('Added '+c.name+'. Change its target in Edit sections.')}}
  if(t.dataset&&t.dataset.popt){UI.pOpt[t.dataset.popt]=t.checked;printOpts()}
  if(t.id==='edPick'&&t.value){readEd();const c=t.value==='blank'?{name:'New section',target:5,q:''}:UI.edCh[+t.value];ED.rows.push(applyRole(SEC(c.name,c.target,c.q||'')));drawEd();const b=$('#sheet .body');if(b)b.scrollTop=b.scrollHeight;if(t.value==='blank'){const ns=document.querySelectorAll('.secbox input.n');const l=ns[ns.length-1];if(l){l.focus();l.select()}}}
  if(t.id==='collLocSel'){UI.collLoc=t.value;rerender()}
  if(t.dataset.pull!==undefined){const d=deck();d.pulled=d.pulled||{};if(t.checked)d.pulled[t.dataset.pull]=1;else delete d.pulled[t.dataset.pull];save();$('#pullN').textContent=Object.keys(d.pulled).filter(n=>owned(n)).length}
  if(t.id==='pType'){$('#pS').hidden=t.value!=='scryfall';$('#pC').hidden=t.value!=='custom'}});
document.addEventListener('input',ev=>{if(ev.target.id==='tS'){const q=ev.target.value.trim().toLowerCase();document.querySelectorAll('#tSL .item').forEach(x=>x.hidden=!!q&&!x.dataset.f.includes(q))}
  if(ev.target.classList.contains('gn')){const i=[...document.querySelectorAll('.gsrow')].indexOf(ev.target.closest('.gsrow'));const dl=$('#dl'+i);if(dl&&i>0)dl.innerHTML=deckOpts(i,ev.target.value.trim())}
  if(ev.target.id==='collQ'){UI.collQ=ev.target.value;const q=UI.collQ.toLowerCase();const l=$('#collList');if(l)l.innerHTML=collRows(collShown())}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('#peek').hidden)A.unpeek();else if(!$('#sheet').hidden)A.close()}});
window.addEventListener('hashchange',route);
/* iPhone: while the keyboard is open the fixed tab bar can be left mid-screen, so hide it then and nudge the page once the keyboard closes */
const isField=t=>t&&t.matches&&t.matches('input:not([type=checkbox]):not([type=file]),textarea,select');
function keepInView(el){if(!el||!el.isConnected||!isField(el))return;const v=window.visualViewport;const r=el.getBoundingClientRect();
  const sb=el.closest('#sheet .body');if(sb){const b=sb.getBoundingClientRect();if(r.top<b.top+8||r.bottom>b.bottom-8)sb.scrollTop+=r.top-b.top-Math.max(8,(b.height-r.height)/3);return}
  const top=(v?v.offsetTop:0)+8,bottom=(v?v.offsetTop+v.height:innerHeight)-12;if(r.bottom>bottom||r.top<top)window.scrollBy(0,r.top-top-Math.max(0,((bottom-top)-r.height)/3))}
document.addEventListener('focusin',e=>{if(!isField(e.target))return;document.body.classList.add('kb');const el=e.target;[60,350,700].forEach(ms=>setTimeout(()=>{if(document.activeElement===el)keepInView(el)},ms))});
document.addEventListener('focusout',e=>{if(!isField(e.target))return;setTimeout(()=>{if(isField(document.activeElement))return;document.body.classList.remove('kb');window.scrollTo(window.scrollX,window.scrollY)},120)});
/* sheets fit the part of the screen above the keyboard */
function fitVV(){const v=window.visualViewport;if(!v)return;const r=document.documentElement.style;r.setProperty('--vh',v.height+'px');r.setProperty('--vt',v.offsetTop+'px')}
try{if(window.visualViewport){visualViewport.addEventListener('scroll',fitVV);fitVV()}}catch(e){}
try{if(window.visualViewport)visualViewport.addEventListener('resize',()=>{fitVV();const open=visualViewport.height<window.innerHeight*.8;document.body.classList.toggle('kb',open&&isField(document.activeElement));if(open)setTimeout(()=>keepInView(document.activeElement),30);if(!open)window.scrollTo(window.scrollX,window.scrollY)})}catch(e){}
load().then(()=>{if(/#friend=/i.test(location.hash))setTimeout(()=>window.dispatchEvent(new HashChangeEvent('hashchange')),600);route();hydrate();if(S.cloudUser){CL.state='loading';fbLoad().catch(e=>{CL.state='error';CL.err=cloudErr({code:'unavailable'});cloudRefresh()})}try{if(hasData()&&navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}});
